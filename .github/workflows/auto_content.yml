name: Auto Generate Content (Wallpaper & Music)

# Robot berjalan jika ada upload ke folder raw_wallpapers atau music
on:
  push:
    paths:
      - 'raw_wallpapers/**'
      - 'music/**'

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik kode repositori
        uses: actions/checkout@v3

      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Library Gambar (Pillow)
        run: pip install Pillow

      - name: Jalankan Skrip Wallpaper
        run: python generate_wallpaper.py

      - name: Jalankan Skrip Musik
        run: python generate_music.py

      - name: Upload Perubahan ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Konten WebP dan JSON" && git push)
